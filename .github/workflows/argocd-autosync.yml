name: argocd-autosync

on:
  push:
    branches: [ "main" ]
    paths:
      - "infra/**"
      - "services/**"
      - "frontend/**"
      - ".github/workflows/argocd-autosync.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install argocd CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Login to Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          test -n "$ARGOCD_SERVER"
          test -n "$ARGOCD_AUTH_TOKEN"
          argocd login "$ARGOCD_SERVER" --grpc-web --insecure --auth-token "$ARGOCD_AUTH_TOKEN"

      - name: Sync apps
        run: |
          argocd app sync sms-root --grpc-web
          argocd app wait sms-root --health --timeout 600 --grpc-web

