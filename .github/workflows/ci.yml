name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: school-onboarding-service
            context: .
            dockerfile: services/school-onboarding-service/Dockerfile
          - name: school-operations-service
            context: .
            dockerfile: services/school-operations-service/Dockerfile
          - name: communication-service
            context: .
            dockerfile: services/communication-service/Dockerfile
          - name: finance-service
            context: .
            dockerfile: services/finance-service/Dockerfile
          - name: subscription-service
            context: .
            dockerfile: services/subscription-service/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: mcp-server
            context: .
            dockerfile: services/mcp-server/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sms/${{ matrix.name }}:ci

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: docker compose config

  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint ./infra/helm/sms-platform
      - name: Helm template
        run: helm template sms-platform ./infra/helm/sms-platform -f ./infra/helm/sms-platform/values-production.yaml > /tmp/sms-platform.yaml
