name: Deploy Kubernetes Environment

on:
  workflow_dispatch:
    inputs:
      values_file:
        description: Helm values file path
        required: true
        default: infra/helm/sms-platform/values-production.yaml
      namespace:
        description: Kubernetes namespace
        required: true
        default: sms
      release_name:
        description: Helm release name
        required: true
        default: sms-platform
      image_tag:
        description: Common image tag to deploy
        required: true
      registry_prefix:
        description: Registry prefix without trailing slash
        required: true
        default: ghcr.io/your-org

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Write kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$KUBECONFIG"
      - name: Deploy chart
        shell: bash
        run: |
          helm upgrade --install "${{ github.event.inputs.release_name }}" ./infra/helm/sms-platform \
            --namespace "${{ github.event.inputs.namespace }}" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 15m \
            -f "${{ github.event.inputs.values_file }}" \
            --set-string global.imageRegistry="${{ github.event.inputs.registry_prefix }}" \
            --set-string services.authService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.schoolOnboardingService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.schoolOperationsService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.communicationService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.financeService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.subscriptionService.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.apiGateway.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.mcpServer.image.tag="${{ github.event.inputs.image_tag }}" \
            --set-string services.frontend.image.tag="${{ github.event.inputs.image_tag }}"
