name: gitops-ghcr-build-and-bump

on:
  push:
    branches: [ "develop" ]
    paths:
      - "services/**"
      - "frontend/**"
      - "infra/helm/sms-platform/**"
      - "infra/scripts/bump_gitops_image_tags.py"
      - ".github/workflows/gitops-ghcr-build-and-bump.yml"
  workflow_dispatch: {}

jobs:
  build_push_and_bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: school-onboarding-service
            context: .
            dockerfile: services/school-onboarding-service/Dockerfile
          - name: school-operations-service
            context: .
            dockerfile: services/school-operations-service/Dockerfile
          - name: communication-service
            context: .
            dockerfile: services/communication-service/Dockerfile
          - name: finance-service
            context: .
            dockerfile: services/finance-service/Dockerfile
          - name: subscription-service
            context: .
            dockerfile: services/subscription-service/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: ai-interaction-service
            context: .
            dockerfile: services/ai-interaction-service/Dockerfile
          - name: mcp-server
            context: .
            dockerfile: services/mcp-server/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GHCR owner (lowercase)
        id: owner
        shell: bash
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=$owner_lc" >> "$GITHUB_OUTPUT"

      - name: Push image ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/sms-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner_lc }}/sms-${{ matrix.name }}:latest

      - name: Bump GitOps values (single runner)
        if: ${{ matrix.name == 'auth-service' }}
        run: |
          python3 infra/scripts/bump_gitops_image_tags.py infra/helm/sms-platform/values-gitops-kind.yaml "${GITHUB_SHA}"

      - name: Commit tag bump (single runner)
        if: ${{ matrix.name == 'auth-service' }}
        run: |
          if git diff --quiet; then
            echo "No tag changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/helm/sms-platform/values-gitops-kind.yaml
          git commit -m "chore(gitops): bump image tags to ${GITHUB_SHA}"
          git push

