name: SMS Platform Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all services'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  metadata:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      any_service: ${{ steps.filter.outputs.any_service }}
      any_java: ${{ steps.filter.outputs.any_java }}
      helm: ${{ steps.filter.outputs.helm }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any_java:
              - 'services/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'tests/**'
            any_service:
              - 'services/**'
              - 'frontend/**'
              - 'tests/**'
            helm:
              - 'infra/helm/**'
            auth-service: 'services/auth-service/**'
            school-onboarding-service: 'services/school-onboarding-service/**'
            school-operations-service: 'services/school-operations-service/**'
            communication-service: 'services/communication-service/**'
            finance-service: 'services/finance-service/**'
            subscription-service: 'services/subscription-service/**'
            api-gateway: 'services/api-gateway/**'
            ai-interaction-service: 'services/ai-interaction-service/**'
            mcp-server: 'services/mcp-server/**'
            frontend: 'frontend/**'

      - name: Resolve GHCR owner (lowercase)
        id: owner
        shell: bash
        run: |
          owner_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=$owner_lc" >> "$GITHUB_OUTPUT"

  frontend-tests:
    name: Frontend Tests
    needs: [metadata]
    if: ${{ needs.metadata.outputs.any_service == 'true' || github.event.inputs.force_build_all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend CI suite
        run: bash tests/ci/run-frontend-tests.sh

  backend-tests:
    name: Backend Tests
    needs: [metadata]
    if: ${{ needs.metadata.outputs.any_java == 'true' || github.event.inputs.force_build_all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run backend CI suite
        run: bash tests/ci/run-backend-tests.sh

  backend-functional-api:
    name: Backend Functional API
    needs: [metadata, backend-tests]
    if: ${{ (needs.metadata.outputs.any_java == 'true' || github.event.inputs.force_build_all == 'true') && secrets.FUNCTIONAL_BASE_URL != '' && secrets.FUNCTIONAL_ADMIN_EMAIL != '' && secrets.FUNCTIONAL_ADMIN_PASSWORD != '' }}
    runs-on: ubuntu-latest
    env:
      FUNCTIONAL_BASE_URL: ${{ secrets.FUNCTIONAL_BASE_URL }}
      FUNCTIONAL_ADMIN_EMAIL: ${{ secrets.FUNCTIONAL_ADMIN_EMAIL }}
      FUNCTIONAL_ADMIN_PASSWORD: ${{ secrets.FUNCTIONAL_ADMIN_PASSWORD }}
      FUNCTIONAL_SCHOOL_ADMIN_PASSWORD: ${{ secrets.FUNCTIONAL_SCHOOL_ADMIN_PASSWORD }}
      FUNCTIONAL_DELETE_APPROVED_ONBOARDING: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Run onboarding functional API suite
        run: bash tests/functional-api/run.sh onboarding

  docker-publish:
    name: 🐳 Docker
    needs: [metadata, frontend-tests, backend-tests, backend-functional-api]
    if: |
      always() && 
      (needs.metadata.outputs.any_service == 'true' || github.event.inputs.force_build_all == 'true') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.backend-functional-api.result == 'success' || needs.backend-functional-api.result == 'skipped') &&
      (contains(needs.metadata.outputs.services, matrix.service) || contains(needs.metadata.outputs.services, 'sms-common') || github.event.inputs.force_build_all == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [
          auth-service, 
          school-onboarding-service, 
          school-operations-service, 
          communication-service, 
          finance-service, 
          subscription-service, 
          api-gateway, 
          ai-interaction-service, 
          mcp-server, 
          frontend
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.owner_lc }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set context
        id: vars
        run: |
          if [ "${{ matrix.service }}" == "frontend" ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
            echo "dockerfile=frontend/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.vars.outputs.context }}
          file: ${{ steps.vars.outputs.dockerfile }}
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/sms-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ needs.metadata.outputs.owner_lc }}/sms-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-gitops:
    name: ☸️ Helm & GitOps
    needs: [metadata, frontend-tests, backend-tests, backend-functional-api, docker-publish]
    if: |
      always() &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.backend-functional-api.result == 'success' || needs.backend-functional-api.result == 'skipped') &&
      (needs.docker-publish.result == 'success' || needs.docker-publish.result == 'skipped') &&
      (needs.metadata.outputs.helm == 'true' || needs.metadata.outputs.any_service == 'true' || github.event.inputs.force_build_all == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint ./infra/helm/sms-platform

      - name: Helm Template (Validation)
        run: |
          helm template sms-platform ./infra/helm/sms-platform -f ./infra/helm/sms-platform/values.yaml -f ./infra/helm/sms-platform/values-gitops-kind.yaml > /tmp/manifest.yaml
          helm template sms-platform ./infra/helm/sms-platform -f ./infra/helm/sms-platform/values.yaml -f ./infra/helm/sms-platform/values-gitops-ec2.yaml > /tmp/manifest-ec2.yaml

      - name: Login to GHCR (for Helm OCI)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.metadata.outputs.owner_lc }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Package & Push Helm OCI
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          helm package ./infra/helm/sms-platform --version 1.0.0-${{ github.run_number }} --app-version ${{ github.sha }}
          helm push sms-platform-1.0.0-${{ github.run_number }}.tgz oci://ghcr.io/${{ needs.metadata.outputs.owner_lc }}/charts

      - name: Bump GitOps Tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          python3 infra/scripts/bump_gitops_image_tags.py infra/helm/sms-platform/values-gitops-kind.yaml "${GITHUB_SHA}"
          python3 infra/scripts/bump_gitops_image_tags.py infra/helm/sms-platform/values-gitops-ec2.yaml "${GITHUB_SHA}"
          
          if git diff --quiet; then
            echo "No tag changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add infra/helm/sms-platform/values-gitops-kind.yaml infra/helm/sms-platform/values-gitops-ec2.yaml
            git commit -m "chore(gitops): update image tags to ${GITHUB_SHA}"
            git push
          fi
