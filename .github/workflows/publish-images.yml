name: Publish Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        default: latest
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - name: school-onboarding-service
            context: .
            dockerfile: services/school-onboarding-service/Dockerfile
          - name: school-operations-service
            context: .
            dockerfile: services/school-operations-service/Dockerfile
          - name: communication-service
            context: .
            dockerfile: services/communication-service/Dockerfile
          - name: finance-service
            context: .
            dockerfile: services/finance-service/Dockerfile
          - name: subscription-service
            context: .
            dockerfile: services/subscription-service/Dockerfile
          - name: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - name: mcp-server
            context: .
            dockerfile: services/mcp-server/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sms-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/sms-${{ matrix.name }}:latest
