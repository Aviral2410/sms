name: Rollout Single Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: Deployment and container name
        required: true
      image_repository:
        description: Full image repository without tag
        required: true
      image_tag:
        description: Image tag
        required: true
      release_name:
        description: Helm release name
        required: true
        default: sms-platform
      namespace:
        description: Kubernetes namespace
        required: true
        default: sms

jobs:
  rollout:
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: ${{ runner.temp }}/kubeconfig
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Write kubeconfig
        shell: bash
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$KUBECONFIG"
      - name: Resolve values key
        id: resolve
        shell: bash
        run: |
          case "${{ github.event.inputs.service }}" in
            auth-service) key="authService" ;;
            school-onboarding-service) key="schoolOnboardingService" ;;
            school-operations-service) key="schoolOperationsService" ;;
            communication-service) key="communicationService" ;;
            finance-service) key="financeService" ;;
            subscription-service) key="subscriptionService" ;;
            ai-interaction-service) key="aiInteractionService" ;;
            api-gateway) key="apiGateway" ;;
            mcp-server) key="mcpServer" ;;
            frontend) key="frontend" ;;
            *) echo "Unknown service"; exit 1 ;;
          esac
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Update service image via Helm
        shell: bash
        run: |
          helm upgrade --install "${{ github.event.inputs.release_name }}" ./infra/helm/sms-platform \
            --namespace "${{ github.event.inputs.namespace }}" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 15m \
            -f ./infra/helm/sms-platform/values-production.yaml \
            --reuse-values \
            --set-string global.imageRegistry="" \
            --set-string services.${{ steps.resolve.outputs.key }}.image.repository="${{ github.event.inputs.image_repository }}" \
            --set-string services.${{ steps.resolve.outputs.key }}.image.tag="${{ github.event.inputs.image_tag }}"
          kubectl -n "${{ github.event.inputs.namespace }}" rollout status deployment/${{ github.event.inputs.service }} --timeout=300s
