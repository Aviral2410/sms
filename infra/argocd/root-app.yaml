apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sms-root
  namespace: argocd
spec:
  project: sms
  source:
    repoURL: https://github.com/Aviral2410/sms.git
    targetRevision: develop
    path: infra/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

