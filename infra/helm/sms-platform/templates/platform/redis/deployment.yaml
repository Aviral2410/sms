{{- if .Values.platform.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
{{ include "sms.commonLabels" (dict "root" . "serviceName" "redis") | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: redis
    spec:
{{ include "sms.podSettings" . | indent 6 }}
      containers:
        - name: redis
          image: {{ include "sms.image" (dict "root" . "image" .Values.platform.redis.image) }}
          imagePullPolicy: {{ .Values.platform.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          {{- if .Values.platform.redis.resources }}
          resources:
{{ toYaml .Values.platform.redis.resources | indent 12 }}
          {{- end }}
{{- end }}

