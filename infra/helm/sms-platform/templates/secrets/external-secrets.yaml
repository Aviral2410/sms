# 1. The Auth Bridge (K8s -> Vault)
# We store the root token in a local secret so the External Secrets Operator can log in to Vault.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: "root" # In production, use Kubernetes Auth or a dedicated Vault Role.

---
# 2. The Secret Store
# This tells Kubernetes how to reach your Vault instance inside the cluster.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token

---
# 3. Automation: Platform Secrets
# Syncs 'secret/sms/platform' from Vault to 'sms-secrets' in Kubernetes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sms-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: sms-secrets # This is the final name used by your pods
    creationPolicy: "Owner"
  data:
    - secretKey: APP_JWT_SECRET
      remoteRef:
        key: sms/platform
        property: JWT_SECRET_KEY
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: sms/platform
        property: POSTGRES_USER
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: sms/platform
        property: POSTGRES_PASSWORD
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: sms/platform
        property: INTERNAL_API_KEY
    - secretKey: PLATFORM_CONFIG_ENCRYPTION_KEY
      remoteRef:
        key: sms/platform
        property: PLATFORM_CONFIG_ENCRYPTION_KEY
    - secretKey: BOOTSTRAP_SUPERADMIN_PASSWORD
      remoteRef:
        key: sms/platform
        property: BOOTSTRAP_SUPERADMIN_PASSWORD
    - secretKey: AI_TOOL_RATE_LIMITS_JSON
      remoteRef:
        key: sms/platform
        property: AI_TOOL_RATE_LIMITS_JSON
    - secretKey: LLM_PROVIDER
      remoteRef:
        key: sms/platform
        property: LLM_PROVIDER
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: sms/platform
        property: OPENAI_API_KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: sms/platform
        property: GEMINI_API_KEY

---
# 4. Automation: Registry Credentials
# Transforms 'secret/sms/ghcr' from Vault into a proper Kubernetes Pull Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: ghcr-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .token }}` }}","auth":"{{ `{{ printf "%s:%s" .username .token | b64enc }}` }}"}}}'
  dataFrom:
    - extract:
        key: sms/ghcr
