# GitOps values for an EC2-hosted Kubernetes cluster (k3s/microk8s/etc).
# - Pulls app images from GHCR using immutable tags (commit SHA).
# - Uses Ingress for external entrypoints (frontend/api/mcp).
# - Uses Vault -> External Secrets Operator -> Secret `sms-secrets` for all URLs/keys.

global:
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret
  # To auto-rollout pods when ExternalSecrets refreshes `sms-secrets`, install Stakater Reloader
  # and keep this annotation enabled.
  podAnnotations:
    reloader.stakater.com/auto: "true"

networking:
  ingress:
    enabled: true
    # For k3s default, use `traefik`. If you install ingress-nginx, use `nginx`.
    className: traefik
    frontendHost: sms.example.com
    frontendWildcardHost: "*.sms.example.com"
    apiHost: api.sms.example.com
    mcpHost: mcp.sms.example.com
    tls:
      enabled: false
      secretName: sms-platform-tls

services:
  # Single-node EC2 defaults (override if you add nodes)
  ollama:
    enabled: false

  authService:
    replicaCount: 1
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: ecdbe1d0d59ad38a9d66b305ace179e3aa658c7d
      pullPolicy: Always
  schoolOnboardingService:
    image:
      repository: ghcr.io/aviral2410/sms-school-onboarding-service
      tag: ecdbe1d0d59ad38a9d66b305ace179e3aa658c7d
