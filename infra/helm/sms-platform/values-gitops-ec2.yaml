# GitOps values for an EC2-hosted Kubernetes cluster (k3s/microk8s/etc).
# - Pulls app images from GHCR using immutable tags (commit SHA).
# - Uses Ingress for external entrypoints (frontend/api/mcp).
# - Uses Vault -> External Secrets Operator -> Secret `sms-secrets` for all URLs/keys.

global:
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret
  # To auto-rollout pods when ExternalSecrets refreshes `sms-secrets`, install Stakater Reloader
  # and keep this annotation enabled.
  podAnnotations:
    reloader.stakater.com/auto: "true"

networking:
  ingress:
    enabled: true
    # For k3s default, use `traefik`. If you install ingress-nginx, use `nginx`.
    className: traefik
    frontendHost: sms.example.com
    frontendWildcardHost: "*.sms.example.com"
    apiHost: api.sms.example.com
    mcpHost: mcp.sms.example.com
    tls:
      enabled: false
      secretName: sms-platform-tls

services:
  # Ollama: local LLM inference. PVC mounts to /data/ollama on the node host.
  # Model pull required after first deploy: kubectl exec -n sms deploy/ollama -- ollama pull llama3.2:3b
  ollama:
    enabled: true
    image:
      repository: ollama/ollama
      tag: "0.3.14"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 6Gi
    persistence:
      enabled: true
      hostPath: /data/ollama
      storageClassName: ollama-local
      size: 50Gi
      existingClaim: ""

  authService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  schoolOnboardingService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    image:
      repository: ghcr.io/aviral2410/sms-school-onboarding-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  schoolOperationsService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-school-operations-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  communicationService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    image:
      repository: ghcr.io/aviral2410/sms-communication-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  financeService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    image:
      repository: ghcr.io/aviral2410/sms-finance-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  subscriptionService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    image:
      repository: ghcr.io/aviral2410/sms-subscription-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  apiGateway:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    env:
      - name: JAVA_OPTS
        value: "-Xmx192m"
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-api-gateway
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  aiInteractionService:
    replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 448Mi
    image:
      repository: ghcr.io/aviral2410/sms-ai-interaction-service
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
    # Override LLM config directly — no Vault dependency for cluster-internal Ollama URL
    env:
      - name: JAVA_OPTS
        value: "-Xmx256m"
      - name: LLM_PROVIDER
        value: "OLLAMA"
      - name: OLLAMA_BASE_URL
        value: "http://ollama:11434"
      - name: OLLAMA_MODEL
        value: "llama3.2:1b"
      - name: SERVER_PORT
        value: "8090"
      - name: GATEWAY_BASE_URL
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: GATEWAY_BASE_URL
      - name: REDIS_HOST
        value: redis
      - name: REDIS_PORT
        value: "6379"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres:5432/sms_platform
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_USER
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_PASSWORD
      - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
  mcpServer:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi
    image:
      repository: ghcr.io/aviral2410/sms-mcp-server
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
  frontend:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-frontend
      tag: fa7a2da6ae64e6d3508030d39a89c68a969743b3
      pullPolicy: Always
