# GitOps values for an EC2-hosted Kubernetes cluster (k3s/microk8s/etc).
# - Pulls app images from GHCR using immutable tags (commit SHA).
# - Uses Ingress for external entrypoints (frontend/api/mcp).
# - Uses Vault -> External Secrets Operator -> Secret `sms-secrets` for all URLs/keys.

global:
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret
  # To auto-rollout pods when ExternalSecrets refreshes `sms-secrets`, install Stakater Reloader
  # and keep this annotation enabled.
  podAnnotations:
    reloader.stakater.com/auto: "true"

networking:
  ingress:
    enabled: true
    # For k3s default, use `traefik`. If you install ingress-nginx, use `nginx`.
    className: traefik
    frontendHost: sms.3.109.156.68.sslip.io
    frontendWildcardHost: "*.sms.3.109.156.68.sslip.io"
    apiHost: api.sms.3.109.156.68.sslip.io
    mcpHost: mcp.sms.3.109.156.68.sslip.io
    tls:
      enabled: false
      secretName: sms-platform-tls

services:
  # Ollama: local LLM inference. PVC mounts to /data/ollama on the node host.
  # Model pull required after first deploy: kubectl exec -n sms deploy/ollama -- ollama pull llama3.2:3b
  ollama:
    enabled: false
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 4Gi
      limits:
        cpu: "1"
        memory: 6Gi
    persistence:
      enabled: true
      hostPath: /data/ollama
      storageClassName: ollama-local
      size: 50Gi
      existingClaim: ""

  authService:
    replicaCount: 1
    resources:
      requests:
        cpu: 20m
        memory: 256Mi
      limits:
        memory: 1Gi
    env:
      - name: JAVA_OPTS
        value: "-Xmx384m"
      - name: APP_JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: JWT_SECRET_KEY
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres:5432/sms_platform
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_USER
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_PASSWORD
      - name: APP_MQTT_BROKER_URL
        value: tcp://emqx:1883
      - name: SPRING_PROFILES_ACTIVE
        value: docker
    autoscaling:
      enabled: false
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: 683a8a658a6b85445dda3f1011764baee74c9572
      pullPolicy: Always
