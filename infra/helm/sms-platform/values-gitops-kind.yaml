# GitOps values for local kind pulling images from GHCR.
# - Uses immutable image tags (commit SHA) so Argo CD rollouts are deterministic.
# - Exposes key entrypoints via NodePort for local access.

global:
  # Keep empty so platform images (postgres/emqx) continue pulling from Docker Hub.
  # App images below are fully-qualified GHCR references.
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret

networking:
  ingress:
    enabled: false

jobs:
  dbRepair:
    enabled: true
    hook: true

services:
  authService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  schoolOnboardingService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-school-onboarding-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  schoolOperationsService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-school-operations-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  communicationService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-communication-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  financeService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-finance-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  subscriptionService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-subscription-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  apiGateway:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-api-gateway
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    service:
      type: NodePort
      nodePort: 30000
    env:
      - name: REDIS_PORT # Override K8s auto-injection string
        value: "6379"

  aiInteractionService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-ai-interaction-service
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    env:
      - name: DB_URL
        value: "jdbc:postgresql://postgres:5432/sms_platform"
      - name: DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_PASSWORD
      - name: DB_SCHEMA
        value: "public"
      - name: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/sms_platform"

  mcpServer:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-mcp-server
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      type: NodePort
      nodePort: 30084

  frontend:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-frontend
      tag: 624b74241b060e008726b6891a0a6445b5bc1f1e
      pullPolicy: Always
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    service:
      type: NodePort
      nodePort: 30080
