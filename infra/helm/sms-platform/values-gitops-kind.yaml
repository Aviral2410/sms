# GitOps values for local kind pulling images from GHCR.
# - Uses immutable image tags (commit SHA) so Argo CD rollouts are deterministic.
# - Exposes key entrypoints via NodePort for local access.

global:
  # Keep empty so platform images (postgres/emqx) continue pulling from Docker Hub.
  # App images below are fully-qualified GHCR references.
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret
  podAnnotations:
    reloader.stakater.com/auto: "true"
  deployment:
    revisionHistoryLimit: 2
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

networking:
  ingress:
    enabled: false

jobs:
  dbRepair:
    enabled: true
    hook: true

services:
  authService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: ae2f614ea22d8bf26d3b3fc5691b31a8e377a190
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    pdb:
      enabled: false
  schoolOnboardingService:
