        value: "jdbc:postgresql://postgres:5432/sms_platform"
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_USER
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_PASSWORD
      - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: "org.postgresql.Driver"
      - name: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/sms_platform"

  mcpServer:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
