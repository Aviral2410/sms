# GitOps values for local kind pulling images from GHCR.
# - Uses immutable image tags (commit SHA) so Argo CD rollouts are deterministic.
# - Exposes key entrypoints via NodePort for local access.

global:
  # Keep empty so platform images (postgres/emqx) continue pulling from Docker Hub.
  # App images below are fully-qualified GHCR references.
  imageRegistry: ""
  imagePullSecrets:
    - ghcr-pull-secret
  deployment:
    revisionHistoryLimit: 2
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

networking:
  ingress:
    enabled: false

jobs:
  dbRepair:
    enabled: true
    hook: true

services:
  authService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-auth-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    pdb:
      enabled: false
  schoolOnboardingService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-school-onboarding-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  schoolOperationsService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-school-operations-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    pdb:
      enabled: false
  communicationService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-communication-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  financeService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-finance-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  subscriptionService:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-subscription-service
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  apiGateway:
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70
    image:
      repository: ghcr.io/aviral2410/sms-api-gateway
      tag: 21ecebd738f0dcd9edb00e43614bae2998fe9183
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    pdb:
      enabled: false
    service:
      type: NodePort
      nodePort: 30000
    env:
      - name: SERVER_PORT
        value: "8080"
      - name: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/sms_platform"
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_USER
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: POSTGRES_PASSWORD
      - name: ONBOARDING_SERVICE_URL
        value: "http://school-onboarding-service:8081"
      - name: AUTH_SERVICE_URL
        value: "http://auth-service:8082"
      - name: SCHOOL_OPERATIONS_SERVICE_URL
        value: "http://school-operations-service:8083"
      - name: MCP_SERVER_URL
        value: "http://mcp-server:8084"
      - name: FINANCE_SERVICE_URL
        value: "http://finance-service:8085"
      - name: COMMUNICATION_SERVICE_URL
        value: "http://communication-service:8089"
      - name: SUBSCRIPTION_SERVICE_URL
        value: "http://subscription-service:8086"
      - name: APP_JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: sms-secrets
            key: JWT_SECRET_KEY
      - name: REDIS_PORT # Override K8s auto-injection string
        value: "6379"

  aiInteractionService:
