    pdb:
      enabled: false

  frontend:
    enabled: true
    workloadName: frontend
    image:
      repository: sms-frontend
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 3000
    service:
      port: 3000
      type: ClusterIP
    env:
      - name: FRONTEND_PORT
        value: "3000"
      - name: GATEWAY_PUBLIC_BASE_URL
        value: http://api-gateway:8080
      - name: MCP_PUBLIC_BASE_URL
        value: http://mcp-server:8084
    probes:
      startup:
        tcpSocket:
          port: http
        periodSeconds: 5
        failureThreshold: 24
      readiness:
        tcpSocket:
          port: http
        periodSeconds: 10
        failureThreshold: 6
      liveness:
        tcpSocket:
          port: http
        periodSeconds: 20
        failureThreshold: 6
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1

