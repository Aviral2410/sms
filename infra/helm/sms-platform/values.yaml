global:
  imageRegistry: ""
  imagePullSecrets: []
  commonLabels: {}
  podAnnotations: {}
  deployment:
    # Optional knobs for local/dev rollouts.
    # When unset, Kubernetes defaults are used (25% surge/unavailable, revHistory=10).
    revisionHistoryLimit: null
    rollingUpdate: null
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Secrets configuration
  secrets:
    # Set to true to create a static K8s secret from the binary/base64 data below.
    # Set to false to use ExternalSecrets (Automated Vault Sync).
    create: false
    existingSecret: sms-secrets
    data: {}

platform:
  redis:
    enabled: true
    serviceName: redis
    image:
      repository: redis
      tag: "7-alpine"
      pullPolicy: IfNotPresent
    service:
      port: 6379
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
  postgres:
    enabled: true
    serviceName: postgres
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    database: sms_platform
    persistence:
      enabled: true
      size: 50Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    service:
      port: 5432
    probes:
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 6
  emqx:
    enabled: true
    serviceName: emqx
    image:
      repository: emqx/emqx
      tag: "5.8.0"
      pullPolicy: IfNotPresent
    service:
      mqttPort: 1883
      httpApiPort: 8083
      dashboardPort: 18083
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi

jobs:
  dbRepair:
    enabled: true
    hook: true
    image:
      repository: postgres
      tag: "16-alpine"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

networking:
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    frontendHost: sms.example.com
    frontendWildcardHost: "*.sms.example.com"
    apiHost: api.sms.example.com
    mcpHost: mcp.sms.example.com
    tls:
      enabled: true
      secretName: sms-platform-tls

services:
  authService:
    enabled: true
    workloadName: auth-service
    image:
      repository: sms-auth-service
      tag: latest
      pullPolicy: IfNotPresent
    replicaCount: 1
    containerPort: 8082
    service:
      port: 8082
      type: ClusterIP
    initDependencies:
      - name: postgres
        host: postgres
        port: 5432
      - name: emqx
        host: emqx
        port: 1883
    env:
      - name: SERVER_PORT
        value: "8082"
      - name: DB_URL
        value: jdbc:postgresql://postgres:5432/sms_platform
      - name: DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: '{{ include "sms.secretName" . }}'
            key: POSTGRES_USER
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: '{{ include "sms.secretName" . }}'
            key: POSTGRES_PASSWORD
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres:5432/sms_platform
      - name: SPRING_DATASOURCE_USERNAME
        valueFrom:
          secretKeyRef:
            name: '{{ include "sms.secretName" . }}'
