apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sms

resources:
  - namespace.yaml
  - platform/postgres/service.yaml
  - platform/postgres/statefulset.yaml
  - platform/emqx/service.yaml
  - platform/emqx/deployment.yaml
  - jobs/db-repair/job.yaml
  - services/auth-service/service.yaml
  - services/auth-service/deployment.yaml
  - services/school-onboarding-service/service.yaml
  - services/school-onboarding-service/deployment.yaml
  - services/school-operations-service/service.yaml
  - services/school-operations-service/deployment.yaml
  - services/communication-service/service.yaml
  - services/communication-service/deployment.yaml
  - services/finance-service/service.yaml
  - services/finance-service/deployment.yaml
  - services/subscription-service/service.yaml
  - services/subscription-service/deployment.yaml
  - services/api-gateway/service.yaml
  - services/api-gateway/deployment.yaml
  - services/mcp-server/service.yaml
  - services/mcp-server/deployment.yaml
  - services/frontend/service.yaml
  - services/frontend/deployment.yaml

configMapGenerator:
  - name: postgres-init-sql
    files:
      - 00-extensions.sql=../../postgres/init/00-extensions.sql
      - 01-create-schemas.sql=../../postgres/init/01-create-schemas.sql
      - 02-onboarding-tables.sql=../../postgres/init/02-onboarding-tables.sql
      - 03-onboarding-seed.sql=../../postgres/init/03-onboarding-seed.sql
      - 04-identity-admin.sql=../../postgres/init/04-identity-admin.sql
      - 05-schoolops-tables.sql=../../postgres/init/05-schoolops-tables.sql
      - 06-schoolops-extended-modules.sql=../../postgres/init/06-schoolops-extended-modules.sql
      - 07-subscription-tables.sql=../../postgres/init/07-subscription-tables.sql
      - 08-subscription-seed.sql=../../postgres/init/08-subscription-seed.sql
      - 09-finance-tables.sql=../../postgres/init/09-finance-tables.sql
      - 10-platform-config.sql=../../postgres/init/10-platform-config.sql
      - 11-platform-settings.sql=../../postgres/init/11-platform-settings.sql
      - 12-transport-management.sql=../../postgres/init/12-transport-management.sql
      - 13-communication-tables.sql=../../postgres/init/13-communication-tables.sql
      - 14-onboarding-selected-plan.sql=../../postgres/init/14-onboarding-selected-plan.sql
      - 15-platform-config-hardening.sql=../../postgres/init/15-platform-config-hardening.sql
  - name: postgres-repair-sql
    files:
      - 01-repair-core.sql=../../postgres/repair/01-repair-core.sql
      - 02-repair-communication.sql=../../postgres/repair/02-repair-communication.sql

generatorOptions:
  disableNameSuffixHash: true
