apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-interaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-interaction-service
  template:
    metadata:
      labels:
        app: ai-interaction-service
    spec:
      containers:
        - name: ai-interaction-service
          image: sms/ai-interaction-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          envFrom:
            - secretRef:
                name: sms-secrets
          env:
            - name: SERVER_PORT
              value: "8090"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration"
            - name: GATEWAY_BASE_URL
              value: "http://api-gateway:8080"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
