apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
      containers:
        - name: api-gateway
          image: sms/api-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: ONBOARDING_SERVICE_URL
              value: http://school-onboarding-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8082
            - name: SCHOOL_OPERATIONS_SERVICE_URL
              value: http://school-operations-service:8083
            - name: MCP_SERVER_URL
              value: http://mcp-server:8084
            - name: FINANCE_SERVICE_URL
              value: http://finance-service:8085
            - name: COMMUNICATION_SERVICE_URL
              value: http://communication-service:8089
            - name: SUBSCRIPTION_SERVICE_URL
              value: http://subscription-service:8086
            - name: REDIS_SERVICE_HOST
              value: "redis"
            - name: REDIS_SERVICE_PORT
              value: "6379"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: JWT_SECRET_KEY
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
