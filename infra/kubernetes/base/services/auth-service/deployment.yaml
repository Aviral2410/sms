apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
        - name: wait-for-emqx
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z emqx 1883; do echo waiting for emqx; sleep 3; done"]
      containers:
        - name: auth-service
          image: sms/auth-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_SCHEMA
              value: identity
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: APP_MQTT_BROKER_URL
              value: tcp://emqx:1883
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: JWT_SECRET_KEY
            - name: COMMUNICATION_SERVICE_URL
              value: http://communication-service:8089
            - name: SCHOOL_OPERATIONS_SERVICE_URL
              value: http://school-operations-service:8083
            - name: BOOTSTRAP_SUPERADMIN_ENABLED
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: BOOTSTRAP_SUPERADMIN_ENABLED
            - name: BOOTSTRAP_SUPERADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: BOOTSTRAP_SUPERADMIN_EMAIL
            - name: BOOTSTRAP_SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: BOOTSTRAP_SUPERADMIN_PASSWORD
            - name: BOOTSTRAP_SUPERADMIN_FULL_NAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: BOOTSTRAP_SUPERADMIN_FULL_NAME
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
