apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communication-service
  template:
    metadata:
      labels:
        app: communication-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
        - name: wait-for-emqx
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z emqx 1883; do echo waiting for emqx; sleep 3; done"]
      containers:
        - name: communication-service
          image: sms/communication-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: SERVER_PORT
              value: "8089"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: MQTT_BROKER_URL
              value: tcp://emqx:1883
            - name: MQTT_CLIENT_ID
              value: communication-service
            - name: SUBSCRIPTION_SERVICE_URL
              value: http://subscription-service:8086
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
