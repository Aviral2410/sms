apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-onboarding-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: school-onboarding-service
  template:
    metadata:
      labels:
        app: school-onboarding-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 3; done"]
        - name: wait-for-emqx
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z emqx 1883; do echo waiting for emqx; sleep 3; done"]
      containers:
        - name: school-onboarding-service
          image: sms/school-onboarding-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sms_platform
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_SCHEMA
              value: onboarding
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: APP_MQTT_BROKER_URL
              value: tcp://emqx:1883
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8082
            - name: COMMUNICATION_SERVICE_URL
              value: http://communication-service:8089
            - name: SUBSCRIPTION_SERVICE_URL
              value: http://subscription-service:8086
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: INTERNAL_API_KEY
            - name: PLATFORM_CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: PLATFORM_CONFIG_ENCRYPTION_KEY
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
