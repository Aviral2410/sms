# Argo CD Application (EC2 cluster - 3.109.156.68)
#
# Apply:
#   sudo k3s kubectl apply -f infra/kubernetes/operations/argocd/apps/sms-platform-ec2-3.109.156.68.yaml
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sms-platform
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: sms
  source:
    repoURL: https://github.com/Aviral2410/sms.git
    targetRevision: develop
    path: infra/helm/sms-platform
    helm:
      releaseName: sms-platform
      valueFiles:
        - values.yaml
        - values-gitops-ec2.yaml
      parameters:
        - name: networking.ingress.frontendHost
          value: sms.3.109.156.68.sslip.io
        - name: networking.ingress.frontendWildcardHost
          value: "*.sms.3.109.156.68.sslip.io"
        - name: networking.ingress.apiHost
          value: api.3.109.156.68.sslip.io
        - name: networking.ingress.mcpHost
          value: mcp.3.109.156.68.sslip.io
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

