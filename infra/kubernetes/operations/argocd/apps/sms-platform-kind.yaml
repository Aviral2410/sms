# Argo CD Application (local kind)
#
# 1) Edit `spec.source.repoURL` to your Git repo URL.
# 2) Apply: kubectl apply -f infra/kubernetes/operations/argocd/apps/sms-platform-kind.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sms-platform-kind
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: sms
  source:
    repoURL: REPLACE_ME_REPO_URL
    targetRevision: develop
    path: infra/helm/sms-platform
    helm:
      valueFiles:
        - values.yaml
        - values-gitops-kind.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
