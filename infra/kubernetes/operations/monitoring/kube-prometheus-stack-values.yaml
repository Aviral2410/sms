prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 30Gi
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
grafana:
  adminPassword: change-me-now
  service:
    type: NodePort
    nodePort: 30090
  persistence:
    enabled: true
    size: 10Gi

prometheus:
  service:
    type: NodePort
    nodePort: 30091

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus-node-exporter:
  enabled: true
defaultRules:
  create: true
