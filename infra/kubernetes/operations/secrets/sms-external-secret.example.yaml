apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sms-secrets
  namespace: sms
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sms-azure-keyvault
    kind: ClusterSecretStore
  target:
    name: sms-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: sms-postgres-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: sms-postgres-password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: sms-jwt-secret
    - secretKey: EMQX_DASHBOARD_USERNAME
      remoteRef:
        key: sms-emqx-username
    - secretKey: EMQX_DASHBOARD_PASSWORD
      remoteRef:
        key: sms-emqx-password
    - secretKey: BOOTSTRAP_SUPERADMIN_ENABLED
      remoteRef:
        key: sms-bootstrap-superadmin-enabled
    - secretKey: BOOTSTRAP_SUPERADMIN_EMAIL
      remoteRef:
        key: sms-bootstrap-superadmin-email
    - secretKey: BOOTSTRAP_SUPERADMIN_PASSWORD
      remoteRef:
        key: sms-bootstrap-superadmin-password
    - secretKey: BOOTSTRAP_SUPERADMIN_FULL_NAME
      remoteRef:
        key: sms-bootstrap-superadmin-full-name
    - secretKey: MCP_REQUIRE_AUTH
      remoteRef:
        key: sms-mcp-require-auth
    - secretKey: MCP_ENABLE_DOCKER_INSIGHTS
      remoteRef:
        key: sms-mcp-enable-docker-insights
    - secretKey: LLM_PROVIDER
      remoteRef:
        key: sms-llm-provider
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: sms-gemini-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: sms-openai-api-key
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: sms-openrouter-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: sms-anthropic-api-key
