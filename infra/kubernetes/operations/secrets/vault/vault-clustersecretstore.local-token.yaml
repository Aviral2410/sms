apiVersion: v1
kind: Namespace
metadata:
  name: sms
---
# Dev-only: static root token bridge for ESO. For real clusters, use Vault Kubernetes auth/AppRole.
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: sms
type: Opaque
stringData:
  token: root
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-local
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: sms
          key: token
