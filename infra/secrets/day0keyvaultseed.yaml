# Day-0 centralized secrets inventory (GitOps-friendly)
#
# This file is the canonical list of secret KEYS the platform expects.
# - "key"   = environment variable / secret key name used by services (stringData key in Kubernetes Secret).
# - "value" = must live in your Vault (or be provided out-of-band for local dev).
#
# For Vault + External Secrets Operator:
# - store these keys in Vault (e.g. `kv/sms/sms-secrets`)
# - sync them into the Kubernetes Secret named `sms-secrets`
#
# For local/dev:
# - Seed Vault once and let ESO materialize `sms/sms-secrets` (preferred).
#
apiVersion: sms.platform/v1alpha1
kind: Day0SecretSeed
metadata:
  name: sms-secrets
  namespace: sms
spec:
  targetSecretName: sms-secrets
  keys:
    # Core platform
    - key: POSTGRES_USER
      required: true
    - key: POSTGRES_PASSWORD
      required: true
    - key: JWT_SECRET_KEY
      required: true
    - key: INTERNAL_API_KEY
      required: true
    - key: PLATFORM_CONFIG_ENCRYPTION_KEY
      required: true

    # Auth bootstrap (dev/staging only; keep disabled in prod)
    - key: BOOTSTRAP_SUPERADMIN_ENABLED
      required: false
    - key: BOOTSTRAP_SUPERADMIN_EMAIL
      required: false
    - key: BOOTSTRAP_SUPERADMIN_PASSWORD
      required: false
    - key: BOOTSTRAP_SUPERADMIN_FULL_NAME
      required: false

    # AI providers (optional depending on LLM_PROVIDER)
    - key: LLM_PROVIDER
      required: false
    - key: OPENAI_API_KEY
      required: false
    - key: OPENAI_MODEL
      required: false
    - key: GEMINI_API_KEY
      required: false
    - key: OPENROUTER_API_KEY
      required: false
    - key: ANTHROPIC_API_KEY
      required: false

    # MCP server options
    - key: MCP_REQUIRE_AUTH
      required: false
    - key: MCP_ENABLE_DOCKER_INSIGHTS
      required: false

    # AI interaction rate-limits (JSON; can be updated in Vault and synced by ESO)
    - key: AI_TOOL_RATE_LIMITS_JSON
      required: false

    # Messaging / email / payments (optional; enable only if used)
    - key: EMQX_DASHBOARD_USERNAME
      required: false
    - key: EMQX_DASHBOARD_PASSWORD
      required: false

