spring:
  application:
    name: ai-interaction-service
  data:
    redis:
      host: ${REDIS_SERVICE_HOST:localhost}
      port: ${REDIS_SERVICE_PORT:6379}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${SPRING_DATASOURCE_USERNAME:sms}
    password: ${SPRING_DATASOURCE_PASSWORD:sms}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
      default_schema: ${DB_SCHEMA:aiinteraction}
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:aiinteraction}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  llm:
    provider: ${LLM_PROVIDER:OLLAMA}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    ollama-base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
    ollama-model: ${OLLAMA_MODEL:llama3.2:3b}
  cache:
    prompt-ttl-seconds: ${AI_PROMPT_CACHE_TTL_SECONDS:90}
    report-ttl-seconds: ${AI_REPORT_CACHE_TTL_SECONDS:300}
