spring:
  application:
    name: ai-interaction-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  gateway-base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
  llm:
    provider: ${LLM_PROVIDER:DISABLED}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llama3.1}
  cache:
    prompt-ttl-seconds: ${AI_PROMPT_CACHE_TTL_SECONDS:90}
    report-ttl-seconds: ${AI_REPORT_CACHE_TTL_SECONDS:300}
