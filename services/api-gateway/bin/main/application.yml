spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
      routes:
        - id: onboarding-service
          uri: ${ONBOARDING_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/onboarding/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
        - id: school-operations-service
          uri: ${SCHOOL_OPERATIONS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/school-ops/**
        - id: mcp-server
          uri: ${MCP_SERVER_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/mcp/**
        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/finance/**
        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/communication/**
        - id: ai-interaction-service
          uri: ${AI_INTERACTION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/v1/ai-interaction/**
        - id: ai-chat-compat
          uri: ${AI_INTERACTION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/chat,/api/health,/api/clear/**,/api/conversations/**/clear
        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/subscriptions/**
        - id: platform-settings
          uri: ${ONBOARDING_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/platform/**
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,gateway}
