spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_SERVICE_HOST:localhost}
      port: ${REDIS_SERVICE_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
            allowCredentials: true
      routes:
        - id: onboarding-service
          uri: ${ONBOARDING_SERVICE_URL:http://school-onboarding-service:8081}
          predicates:
            - Path=/api/v1/onboarding/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8082}
          predicates:
            - Path=/api/v1/auth/**
        - id: school-operations-service
          uri: ${SCHOOL_OPERATIONS_SERVICE_URL:http://school-operations-service:8083}
          predicates:
            - Path=/api/v1/school-ops/**
        - id: mcp-server
          uri: ${MCP_SERVER_URL:http://mcp-server:8084}
          predicates:
            - Path=/api/v1/mcp/**
        - id: mcp-server-http
          uri: ${MCP_SERVER_URL:http://mcp-server:8084}
          predicates:
            - Path=/mcp-http/**
          filters:
            - StripPrefix=1
        - id: finance-service
          uri: ${FINANCE_SERVICE_URL:http://finance-service:8085}
          predicates:
            - Path=/api/v1/finance/**
        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URL:http://communication-service:8089}
          predicates:
            - Path=/api/v1/communication/**
        - id: ai-interaction-service
          uri: ${AI_INTERACTION_SERVICE_URL:http://ai-interaction-service:8090}
          predicates:
            - Path=/api/v1/ai-interaction/**
        - id: ai-chat-compat
          uri: ${AI_INTERACTION_SERVICE_URL:http://ai-interaction-service:8090}
          predicates:
            - Path=/api/chat,/api/health,/api/clear/**,/api/conversations/{conversationId}/clear
        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL:http://subscription-service:8086}
          predicates:
            - Path=/api/v1/subscriptions/**
        - id: platform-settings
          uri: ${ONBOARDING_SERVICE_URL:http://school-onboarding-service:8081}
          predicates:
            - Path=/api/v1/platform/**
        - id: public-site
          uri: ${ONBOARDING_SERVICE_URL:http://school-onboarding-service:8081}
          predicates:
            - Path=/api/v1/public/**
        - id: tenant-resolution
          uri: ${AUTH_SERVICE_URL:http://auth-service:8082}
          predicates:
            - Path=/public/tenant/resolve

app:
  jwt:
    secret: ${JWT_SECRET_KEY:default_development_secret_key_change_in_production}
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://subscription-service:8086}
  platform-domain: ${PLATFORM_DOMAIN:platform.com}
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8082}
server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,gateway}

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
