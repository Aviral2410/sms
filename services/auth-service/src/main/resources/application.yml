spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${DB_USERNAME:sms_admin}
    password: ${DB_PASSWORD:sms_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:identity}
        jdbc:
          time_zone: UTC
    open-in-view: false
server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  bootstrap:
    superadmin:
      enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPERADMIN_EMAIL:}
      password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_SUPERADMIN_FULL_NAME:Platform Super Admin}

  # Internal service-to-service URLs (used for public join + password reset dispatch).
  communication-service-url: ${COMMUNICATION_SERVICE_URL:http://localhost:8089}
  school-operations-service-url: ${SCHOOL_OPERATIONS_SERVICE_URL:http://localhost:8083}
  jwt:
    secret: ${APP_JWT_SECRET:d41d8cd98f00b204e9800998ecf8427e}
