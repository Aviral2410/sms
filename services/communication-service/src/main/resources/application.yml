server:
  port: 8089

spring:
  application:
    name: communication-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${SPRING_DATASOURCE_USERNAME:sms_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:sms_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: communication

logging:
  level:
    root: INFO
    com.sms.communication: DEBUG
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:communication-service}

app:
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8086}
