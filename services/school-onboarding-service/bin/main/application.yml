spring:
  application:
    name: school-onboarding-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${DB_USERNAME:sms_admin}
    password: ${DB_PASSWORD:sms_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:onboarding}
        jdbc:
          time_zone: UTC
    open-in-view: false
server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8082}
  communication-service-url: ${COMMUNICATION_SERVICE_URL:http://localhost:8085}
