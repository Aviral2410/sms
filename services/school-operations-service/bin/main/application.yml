spring:
  application:
    name: school-operations-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${DB_USERNAME:sms_admin}
    password: ${DB_PASSWORD:sms_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:schoolops}
        jdbc:
          time_zone: UTC
    open-in-view: false
server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

app:
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8082}
  communication-service-url: ${COMMUNICATION_SERVICE_URL:http://localhost:8085}
  subscription-service-url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8086}
  mcp-server-url: ${MCP_SERVER_URL:http://localhost:8084}
  # LLM Providers — set the key(s) you have; omit the rest
  # llm-provider: auto | gemini | openai | anthropic   (auto = first key found wins)
  llm-provider: ${LLM_PROVIDER:auto}
  gemini-api-key: ${GEMINI_API_KEY:}
  openai-api-key: ${OPENAI_API_KEY:}
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
