spring:
  application:
    name: subscription-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sms_platform}
    username: ${DB_USERNAME:sms_admin}
    password: ${DB_PASSWORD:sms_admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:subscription}
        jdbc:
          time_zone: UTC
    open-in-view: false
server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}
